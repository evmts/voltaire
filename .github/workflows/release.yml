name: Release

# Publishing waits for CI to pass on the exact main commit it ships. A
# manual dispatch gets no bypass: it publishes only if the CI workflow
# already succeeded for a push of that same commit.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # workflow_run's branch filter matches a fork PR whose branch is named
    # main, so also require a push to this repository.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Skip stale release run if main has moved forward
        id: head_check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          echo "main_sha=$main_sha"
          echo "release_sha=$RELEASE_SHA"
          if [ "$main_sha" != "$RELEASE_SHA" ]; then
            echo "::notice::Skipping stale Release run for $RELEASE_SHA because main is already at $main_sha (the newer commit's CI/Release run will ship)."
            echo "is_head=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require CI success for this commit
        if: steps.head_check.outputs.is_head == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful CI push run on main for $RELEASE_SHA; refusing to publish."
            exit 1
          fi
          echo "CI succeeded for $RELEASE_SHA."

      - uses: actions/checkout@v4
        if: steps.head_check.outputs.is_head == 'true'
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ env.RELEASE_SHA }}

      # Prevent `git fetch` inside changesets/action from trying to recurse into
      # historical submodule commits that no longer exist upstream.
      - name: Disable recursive submodule fetch
        if: steps.head_check.outputs.is_head == 'true'
        run: git config fetch.recurseSubmodules false

      - name: Install Zig 0.17.1
        if: steps.head_check.outputs.is_head == 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install Rust wasm32 target
        if: steps.head_check.outputs.is_head == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install pnpm
        if: steps.head_check.outputs.is_head == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.head_check.outputs.is_head == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.head_check.outputs.is_head == 'true'
        run: pnpm install --frozen-lockfile

      - name: Fetch verified native artifacts for this commit (if built)
        id: fetch_native
        if: steps.head_check.outputs.is_head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            "repos/$REPO/actions/workflows/build-native.yml/runs?head_sha=$RELEASE_SHA&branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No completed Build Native Bindings run found for $RELEASE_SHA; skipping native platform packages."
            echo "has_native=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p native
          gh run download "$run_id" --repo "$REPO" --name native-all-platforms --dir native
          node scripts/package-native-platforms.mjs \
            --input-dir native \
            --out-dir dist-native \
            --allow-partial \
            --verify
          echo "has_native=true" >> "$GITHUB_OUTPUT"

      # Publish prebuilt @tevm/voltaire-<platform> packages before @tevm/voltaire
      # so optionalDependencies resolve immediately on install. Preserves the
      # CI_VERIFIED_SHA safety gate and prefers OIDC Trusted Publishing over NPM_TOKEN.
      - name: Publish native platform npm packages
        if: steps.head_check.outputs.is_head == 'true' && steps.fetch_native.outputs.has_native == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI_VERIFIED_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          if [ "$CI_VERIFIED_SHA" != "$head_sha" ]; then
            echo "::error::CI_VERIFIED_SHA ($CI_VERIFIED_SHA) does not match HEAD ($head_sha); refusing to publish native platform packages."
            exit 1
          fi
          : > dist-native/published-native-packages.txt
          for pkg_dir in dist-native/npm/voltaire-*; do
            [ -d "$pkg_dir" ] || continue
            name=$(node -p "JSON.parse(require('node:fs').readFileSync('$pkg_dir/package.json', 'utf8')).name")
            version=$(node -p "JSON.parse(require('node:fs').readFileSync('$pkg_dir/package.json', 'utf8')).version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping."
              echo "${name}@${version}" >> dist-native/published-native-packages.txt
              continue
            fi
            if env -u NPM_TOKEN -u NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG=/dev/null npm publish "$pkg_dir" --registry=https://registry.npmjs.org --access public --provenance --ignore-scripts; then
              echo "${name}@${version}" >> dist-native/published-native-packages.txt
              continue
            fi
            if [ -n "${NPM_TOKEN:-}" ]; then
              if env NPM_CONFIG_USERCONFIG=/dev/null "npm_config_//registry.npmjs.org/:_authToken=${NPM_TOKEN}" npm publish "$pkg_dir" --registry=https://registry.npmjs.org --access public --provenance --ignore-scripts; then
                echo "${name}@${version}" >> dist-native/published-native-packages.txt
              else
                echo "::warning::Skipping ${name}@${version}; configure npm Trusted Publishing or rotate NPM_TOKEN."
              fi
            else
              echo "::warning::Skipping ${name}@${version}; configure npm Trusted Publishing for ${name}."
            fi
          done

      # `pnpm release` builds WASM and every package, verifies them with
      # --load, then publishes those exact files with --ignore-scripts.
      - name: Create Release Pull Request or Publish
        id: changesets
        if: steps.head_check.outputs.is_head == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          # Default git-cli commitMode is required because github-api cannot
          # serialize executable files inside checked-out git submodules.
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # publish-npm.mjs refuses to publish unless this matches HEAD; it is
          # set only after CI success for RELEASE_SHA is established above.
          CI_VERIFIED_SHA: ${{ env.RELEASE_SHA }}

      - name: Attach C99 ABI release tarballs to GitHub Release
        if: steps.head_check.outputs.is_head == 'true' && steps.fetch_native.outputs.has_native == 'true' && steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/voltaire-ts/package.json', 'utf8')).version")
          tag="@tevm/voltaire@${version}"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist-native/c-abi/voltaire-c-abi-*.tar.gz \
              dist-native/c-abi/SHA256SUMS.txt \
              --repo "$REPO" \
              --clobber
          else
            gh release create "$tag" \
              dist-native/c-abi/voltaire-c-abi-*.tar.gz \
              dist-native/c-abi/SHA256SUMS.txt \
              --repo "$REPO" \
              --target "$RELEASE_SHA" \
              --title "$tag" \
              --notes "Voltaire v${version} release with prebuilt C99 ABI tarballs and SHA256SUMS."
          fi
