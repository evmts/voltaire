# Zig 0.17.1 CI matrix
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        optimize: [Debug, ReleaseSmall, ReleaseSafe, ReleaseFast]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}
      - name: Debug - List target directory (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== Listing target directory structure ==="
          find target -name "*.a" -o -name "*.lib" 2>/dev/null | head -20 || echo "No .a or .lib files found"
          echo ""
          echo "=== Listing target/release ==="
          ls -la target/release/ 2>/dev/null || echo "target/release/ does not exist"
          echo ""
          echo "=== Listing all target subdirectories ==="
          find target -type d -maxdepth 2 2>/dev/null || echo "target/ does not exist"
          echo ""
          echo "=== Listing files in target root ==="
          ls -la target/ 2>/dev/null || echo "target/ does not exist"
      - name: Test
        run: zig build test -Doptimize=${{ matrix.optimize }}

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build keccak256 example
        run: zig build example-keccak256
      - name: Build ABI example
        run: zig build example-abi
      # secp256k1 example disabled: signature verification fails on Linux CI
      # See: unaudited_signHash recovery verification issue on ubuntu-latest
      # - name: Build secp256k1 example
      #   run: zig build example-secp256k1
      - name: Build address example
        run: zig build example-address
      - name: Build hex example
        run: zig build example-hex
      - name: Build RLP example
        run: zig build example-rlp
      # EIP-712 example disabled: signature verification fails on Linux CI (same issue as secp256k1)
      # - name: Build EIP-712 example
      #   run: zig build example-eip712
      # Transaction example disabled: signature verification fails on Linux CI (same issue as secp256k1)
      # - name: Build transaction example
      #   run: zig build example-transaction
      # C API example disabled until libwally-core dependency is fixed
      # - name: Build C API example
      #   run: zig build example-c

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build for WASM
        run: zig build -Dtarget=wasm32-wasi -Doptimize=ReleaseSmall

  c-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build libprimitives_c and generate primitives.h
        run: zig build -Dwith-c-api=true -Doptimize=ReleaseFast
      - name: Verify C API artifacts and smoke-test C FFI link
        run: |
          test -f zig-out/include/primitives.h
          test -f zig-out/lib/libprimitives_c.a
          test -f zig-out/lib/libprimitives_c.so
          cc -Izig-out/include packages/voltaire-zig/examples/c/basic_usage.c \
            -Lzig-out/lib -Wl,-rpath,"$PWD/zig-out/lib" -lprimitives_c \
            -o /tmp/voltaire_c_smoke
          /tmp/voltaire_c_smoke

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Check formatting
        run: zig fmt --check build.zig packages/voltaire-zig/src packages/voltaire-zig/lib packages/voltaire-zig/examples
      - name: Factory projections are valid JSON
        run: |
          node -e 'for (const f of [".smithers/factory.json", ".smithers/home.json"]) JSON.parse(require("fs").readFileSync(f, "utf8")); console.log("factory projections valid")'

  smithers-factory:
    name: Smithers Factory, Wiki & Lighthouse Audit
    runs-on: ubuntu-latest
    env:
      # Shared Smithers Cloud object store (https://build.smithers.sh).
      # Fork PRs are untrusted: they may read cached results but NEVER receive
      # SMITHERS_CACHE_WRITE_TOKEN so they cannot poison the shared cache.
      SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
      SMITHERS_CACHE_WRITE_TOKEN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.SMITHERS_CACHE_WRITE_TOKEN || '' }}
      GITHUB_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork == true && 'true' || 'false' }}
      SMITHERS_UNTRUSTED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Smithers factory dependencies
        working-directory: .smithers
        run: bun install --frozen-lockfile
      - name: Install Uphill
        run: |
          command -v uphill >/dev/null 2>&1 || curl -fsSL https://wevm.sh/uphill | sh
          echo "$HOME/.uphill/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Verify Smithers factory, home, wiki, mythical history, audit, and trust tests
        run: |
          scripts/smthrs ci \
            //.smithers:factory-check \
            //.smithers:home-check \
            //.smithers:wiki-check \
            //.smithers:mythical-check \
            //.smithers:factory-test \
            //.smithers:audit-report
      - name: Upload Lighthouse backpressure audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltaire-lighthouse-audit-report
          path: |
            .smithers/reports/audit-report.html
            .smithers/reports/audit-report.json
          retention-days: 30

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig 0.17.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build Zig library (required for FFI tests)
        run: zig build -Doptimize=ReleaseFast -Dwith-c-api=false
      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and stage WASM
        run: pnpm --filter @tevm/zig build:wasm
      - name: Run typecheck
        run: pnpm --filter @tevm/voltaire run typecheck
      - name: Run lint check
        run: pnpm -r run lint:check
      - name: Run format check
        run: pnpm -r run format:check
      # Dependency check disabled: false positives for bun/vite/typedoc plugins
      # - name: Run dependency check
      #   run: pnpm run lint:deps
      - name: Build distribution
        run: pnpm --filter @tevm/voltaire run build:dist
      - name: Build types
        run: pnpm --filter @tevm/voltaire run build:types
      - name: Run package validation
        run: pnpm --filter @tevm/voltaire run lint:package
      - name: Verify workspace packaging
        run: node scripts/verify-packaging.mjs --load
      - name: Run TypeScript tests with coverage
        run: pnpm --filter @tevm/voltaire run test:coverage
      # Native FFI tests disabled until libwally-core C API is fixed
      # - name: Run native FFI tests
      #   run: pnpm run test:native
      - name: Run WASM tests
        run: pnpm --filter @tevm/voltaire run test:wasm

  # Benchmarks disabled - keccak_wrapper.h include path issue needs fix in build.zig
