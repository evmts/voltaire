name: Docs & Smithers Feeds

# Automatically triggered whenever Smithers Cloud lands and mirrors main to
# GitHub (mirror: "push"), verifying Mintlify docs + llms.txt parity and
# publishing Voltaire's Obsidian wiki, mythical history, and Lighthouse audit
# report to Smithers Cloud repository feeds.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/voltaire-ts/docs/**'
      - 'packages/voltaire-zig/docs/**'
      - '.smithers/**'
      - '.agents/uphill/**'
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-feeds:
    name: Verify Docs & Publish Smithers Feeds
    runs-on: ubuntu-latest
    env:
      SMITHERS_FEED_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.SMITHERS_FEED_KEY || '' }}
      MINTLIFY_DEPLOY_HOOK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.MINTLIFY_DEPLOY_HOOK || '' }}
      SMITHERS_UNTRUSTED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Mintlify docs.json and llms.txt index parity
        run: pnpm --filter @tevm/voltaire exec vitest run docs/docs-index.test.ts
      - name: Install Uphill and generate Lighthouse audit report
        run: |
          command -v uphill >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/wevm/uphill/main/install.sh | sh
          PATH="$HOME/.uphill/bin:$HOME/.bun/bin:$PATH" node scripts/audit-report.mjs --strict
      - name: Build and publish Smithers Cloud wiki, mythical history, and audit feeds
        run: |
          if [ -n "$SMITHERS_FEED_KEY" ]; then
            node scripts/publish-feeds.mjs
          else
            node scripts/publish-feeds.mjs --dry-run
          fi
      - name: Trigger Mintlify docs deploy hook (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MINTLIFY_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$MINTLIFY_DEPLOY_HOOK"
      - name: Upload feeds payload and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltaire-docs-and-feeds
          path: |
            .smithers/reports/feeds-payload.json
            .smithers/reports/audit-report.html
            .smithers/reports/audit-report.json
          retention-days: 30
