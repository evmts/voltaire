name: voltaire-effect CI

on:
  push:
    paths:
      - 'packages/voltaire-ts/**'
      - 'packages/voltaire-effect/**'
      - 'packages/voltaire-zig/wasm/**'
      - '.github/workflows/voltaire-effect-ci.yml'
  pull_request:
    paths:
      - 'packages/voltaire-ts/**'
      - 'packages/voltaire-effect/**'
      - 'packages/voltaire-zig/wasm/**'
      - '.github/workflows/voltaire-effect-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # voltaire-effect imports @tevm/voltaire/* from dist/, so build both the
      # JS bundle (build:dist, which copies the committed voltaire-zig/wasm) and
      # the declarations (build:types).
      - name: Build @tevm/voltaire
        run: pnpm --filter @tevm/voltaire build

      - name: Typecheck
        run: pnpm --filter voltaire-effect typecheck

      - name: Test
        run: pnpm --filter voltaire-effect test:run

      - name: Build
        run: pnpm --filter voltaire-effect build
