name: Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/voltaire-ts/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets are unavailable in step `if:` expressions; expose the token as
      # env so the deploy step can skip when the repository has no Vercel setup.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build voltaire-ts (for workspace dep)
        run: pnpm --filter @tevm/voltaire run build:dist

      - name: Build playground
        run: pnpm --filter @tevm/playground run build

      - name: Skip deploy (VERCEL_TOKEN not set)
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice title=Deploy skipped::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets are not set; the playground built but was not deployed."

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/playground
          vercel-args: '--prod'
