# Each measurement's `baseline`, the size, count, or check `uphill --update` accepted, and its
# `target`. Edit a target here, and each run reports what changed since the baseline.

footprint:
  wasm-bundle-size:
    "*": { target: 350kB }
    "primitives.wasm:gzip": { baseline: 578727B, target: 200kB }
    "primitives.wasm:raw": { baseline: 1248913B }
  primitive-source-bytes:
    "*": { target: 15kB }
    crypto/Bls12381: { baseline: 12849B }
    crypto/EIP712: { baseline: 8425B }
    crypto/KZG: { baseline: 11185B }
    crypto/Keccak256: { baseline: 4453B }
    crypto/Secp256k1: { baseline: 9680B }
    crypto/bn254: { baseline: 10502B }
    primitives/Abi: { baseline: 44431B, target: 20kB }
    primitives/Address: { baseline: 22507B, target: 5kB }
    primitives/Hash: { baseline: 7309B, target: 5kB }
    primitives/Hex: { baseline: 13143B, target: 3kB }
    primitives/Rlp: { baseline: 10867B, target: 8kB }
    primitives/Transaction: { baseline: 27029B }
    primitives/Uint: { baseline: 12844B, target: 10kB }
  package-deps:
    "*": { target: 3 }
    "@tevm/voltaire": { baseline: 8 }
    Cargo.toml: { baseline: 7, target: 6 }

