    primitives/Rlp: { baseline: fail }
    primitives/StateDiff: { baseline: fail }
    primitives/SyncStatus: { baseline: fail }
    primitives/Transaction: { baseline: fail }
    primitives/TrieHash: { baseline: fail }
    primitives/Uint: { baseline: fail }
    primitives/Uncle: { baseline: fail }
    primitives/UserOperation: { baseline: fail }
    root: { baseline: fail }
    state-manager: { baseline: fail }
  rust-no-unwrap-panic:
    "*": { baseline: pass }
  rust-unsafe-blocks:
    packages/voltaire-zig/src/crypto/bn254_wrapper.rs: { baseline: 10 }
    packages/voltaire-zig/src/crypto/keccak_wrapper.rs: { baseline: 3 }
    packages/voltaire-zig/src/crypto/lib.rs: { baseline: 0 }

