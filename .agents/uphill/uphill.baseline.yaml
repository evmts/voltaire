# Each measurement's `baseline`, the size, count, or check `uphill --update` accepted, and its
# `target`. Edit a target here, and each run reports what changed since the baseline.

footprint:
  wasm-bundle-size:
    "*": { target: 350kB }
    "primitives.wasm:gzip": { baseline: 120279B, target: 200kB }
    "primitives.wasm:raw": { baseline: 344825B }
  primitive-source-bytes:
    "*": { target: 15kB }
    crypto/Bls12381: { baseline: 12914B }
    crypto/EIP712: { baseline: 10299B }
    crypto/KZG: { baseline: 11963B }
    crypto/Keccak256: { baseline: 4463B }
    crypto/Secp256k1: { baseline: 9567B }
    crypto/bn254: { baseline: 10502B }
    primitives/Abi: { baseline: 45135B, target: 20kB }
    primitives/Address: { baseline: 22672B, target: 5kB }
    primitives/Hash: { baseline: 7499B, target: 5kB }
    primitives/Hex: { baseline: 13404B, target: 3kB }
    primitives/Rlp: { baseline: 11299B, target: 8kB }
    primitives/Transaction: { baseline: 27294B }
    primitives/Uint: { baseline: 13240B, target: 10kB }
  package-deps:
    "*": { target: 3 }
    "@tevm/voltaire": { baseline: 6 }
    Cargo.toml: { baseline: 7, target: 6 }

zig-rust-safety:
